# 로컬 개발용 PostgreSQL.
#
#   docker compose up -d db      # 기동
#   docker compose ps            # 상태
#   docker compose logs -f db    # 로그
#   docker compose down          # 중지 (데이터 유지)
#   docker compose down -v       # 중지 + 데이터 삭제 (초기화)
#
# 운영은 Supabase(PostgreSQL)를 사용한다. 이 구성은 로컬 전용이다.

services:
  db:
    image: postgres:16-alpine
    container_name: deeppoint-scm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deeppoint_scm
      # 업무일자(business_date)는 애플리케이션에서 KST 로 파생한다.
      # DB 세션 타임존은 UTC 로 고정해 서버 환경에 따라 달라지지 않게 한다.
      TZ: UTC
      PGTZ: UTC
    ports:
      # 로컬에 다른 PostgreSQL 이 있을 수 있어 5432 대신 55432 를 쓴다.
      - '55432:5432'
    volumes:
      - deeppoint-scm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d deeppoint_scm']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  deeppoint-scm-pgdata:
    name: deeppoint-scm-pgdata
