# FIN-02A 전용 개발/시험 DB. 기존 SCM/WMS 의 루트 docker-compose.yml(포트 5432, 볼륨) 과 분리한다.
services:
  fin02a-db:
    image: postgres:16-alpine
    container_name: fin02a-db
    environment:
      POSTGRES_USER: fin02a
      POSTGRES_PASSWORD: fin02a-dev-only
      POSTGRES_DB: fin02a_dev
    ports:
      - '5433:5432'
    volumes:
      - fin02a_pgdata:/var/lib/postgresql/data
volumes:
  fin02a_pgdata:
